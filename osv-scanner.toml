[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2027-05-05
reason = "glob@13.0.6 via jest@30.5.2 -> @jest/core@30.5.2 -> @jest/reporters, jest-config and jest-runtime@30.5.2 and via react-native-builder-bob@0.44.1, and glob@10.5.0 via jest -> @jest/transform -> babel-plugin-istanbul@8.0.2 -> test-exclude@7.0.2, have no compatible patch as of 2026-11-05: the advisory covers >= 9.0.0, <= 14.0.1 and the fix is glob 14.0.2. jest 30.5.2 is the newest jest and its three packages still require glob@^13.0.6, as does react-native-builder-bob 0.44.1, its newest release; babel-plugin-istanbul 8.0.2, its newest release, still requires test-exclude@^7.0.1, which requires glob@^10.4.1, and 10.5.0 is the last glob 10.x release. Medium severity, AbortSignal cancellation bypass that allows filesystem traversal after a timeout. Dev-only paths (jest and the builder-bob build tool), and no first-party source imports glob. Approved on 2026-11-05. Re-evaluate when jest and react-native-builder-bob accept glob 14 or babel-plugin-istanbul moves to a test-exclude release that does."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-05-05
reason = "minimatch@10.2.6 via the eslint@10.13.0 devDependency (directly and through @eslint/config-array@0.23.5), @react-native/eslint-config@0.88.0 -> @typescript-eslint/parser@8.72.0 -> @typescript-eslint/typescript-estree@8.72.0, glob@13.0.6, and test-exclude@7.0.2, and minimatch@9.0.9 via test-exclude@7.0.2 -> glob@10.5.0, have no compatible patch as of 2026-11-05: the advisory covers >= 7.0.0, < 11.0.1 and the fix is minimatch 11.0.1. The newest eslint (10.14.0) requires minimatch@^10.2.6, @eslint/config-array 0.23.5 and @typescript-eslint/typescript-estree 8.72.1, both the newest releases, require ^10.2.4 and ^10.2.2, and 10.2.6 and 9.0.9 are the last releases of their lines. Medium severity, DoS through globparts. Dev-only paths (eslint, jest, builder-bob), and no first-party source imports minimatch. Approved on 2026-11-05. Re-evaluate when eslint, @eslint/config-array and typescript-estree accept minimatch 11 and the jest and builder-bob chains move off glob 10 and 13."

[[IgnoredVulns]]
