reason = "deepmerge@4.3.1 via the example workspace's @react-native-community/cli@20.2.0 (also through @react-native-community/cli-config@20.2.0 and @react-native-community/cli-doctor@20.2.0) and via jest@30.5.2 -> @jest/core@30.5.2 -> jest-config@30.5.2 has no patched release as of 2026-11-05: the advisory lists no first_patched_version for >= 4.2.0, <= 4.3.1, and 4.3.1 is the latest published version (npm view deepmerge version), itself affected. Low severity, prototype poisoning through mergeObject(). Every parent is a devDependency and no first-party source imports deepmerge; whether those tools call mergeObject() with untrusted input was not verified. Approved on 2026-11-05. Re-evaluate when deepmerge publishes a patched release or @react-native-community/cli and jest-config drop it."
