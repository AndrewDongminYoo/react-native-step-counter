name: Native Android Example Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    # Deliberately an ignore list, not an allow list. Too many things reach a
    # native build indirectly — codegen reads src, autolinking reads
    # react-native.config.js, the setup action installs from yarn.lock — and a
    # path missing from an allow list skips the job silently, which looks
    # identical to a pass. A path missing from an ignore list only costs one
    # redundant build.
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - src/__tests__/**
      - .github/workflows/ci.yml
      - .github/workflows/pages.yml
  # Matches ci.yml. Merge groups do not honour paths-ignore, so this runs
  # unconditionally once a merge queue is enabled.
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: "17"

      - name: Finalize Android SDK
        run: /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Test Android hardware-counter sessions
        working-directory: example/android
        run: ./gradlew :react-native-step-counter-newarch:testDebugUnitTest --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

      - name: Build example for Android
        env:
          JAVA_OPTS: -XX:MaxHeapSize=6g
        run: yarn example build:android

      - name: Check merged sensor manifest
        run: python3 tests/android/check-merged-manifest.py example/android/app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml

      - name: Create clean packed-package consumer (minimum and current RN 0.88.0)
        run: bash tests/compatibility/create-consumer.sh "$RUNNER_TEMP/compatibility-consumer"

      - name: Record consumer toolchain
        working-directory: ${{ runner.temp }}/compatibility-consumer
        run: |
          node --version
          npm ls react react-native react-native-step-counter-newarch
          java -version
          cat android/build.gradle
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build clean Android consumer
        working-directory: ${{ runner.temp }}/compatibility-consumer/android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a
