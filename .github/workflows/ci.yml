name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Trunk
        run: |
          curl -fsSL https://trunk.io/releases/trunk -o "$RUNNER_TEMP/trunk"
          chmod +x "$RUNNER_TEMP/trunk"
          printf 'TRUNK_PATH=%s\n' "$RUNNER_TEMP/trunk" >> "$GITHUB_ENV"

      - name: Lint
        run: |
          "$TRUNK_PATH" check --ci --all --no-fix --filter=eslint --monitor=false

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Replay JavaScript benchmark and validate raw results
        run: |
          node --test tests/benchmarks/*.node.mjs
          node tests/benchmarks/run.mjs node "$RUNNER_TEMP/step-benchmark-js"
          node tests/benchmarks/results.mjs "$RUNNER_TEMP/step-benchmark-js/node-result.json"

      - name: Upload JavaScript benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-js
          path: ${{ runner.temp }}/step-benchmark-js/

      - name: Build package
        run: yarn prepare

      - name: Check package contents
        run: yarn pack --dry-run
