version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      # Every version update, majors included, in one PR; CI runs the actions it bumps.
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    ignore:
      # React Native 0.88's Babel preset requires Babel 7 (#74: every Jest suite failed on @babel/core 8).
      # update-types limits this to version updates; security updates still open.
      - dependency-name: "@babel/*"
        update-types:
          - version-update:semver-major
      # The React Native version is chosen by the upgrade path, not by Dependabot.
      # update-types limits this to version updates; security updates still open.
      - dependency-name: react-native
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "@react-native/*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: gradle
    directories:
      - /android
      - /example/android
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    ignore:
      # The Android Gradle Plugin follows the Flutter or React Native toolchain, not Dependabot.
      # update-types limits this to version updates; security updates still open.
      - dependency-name: com.android.application
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: com.android.library
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      # The Kotlin Gradle plugin and its stdlib must match the framework's bundled Kotlin.
      - dependency-name: org.jetbrains.kotlin.android
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: org.jetbrains.kotlin:kotlin-stdlib
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      # Gradle wrapper upgrades follow the React Native toolchain, not Dependabot (#70: Gradle 9.8.1 broke the build).
      # update-types limits this to version updates; security updates still open.
      - dependency-name: gradle-wrapper
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      # The same two plugins, declared as classpath coordinates.
      - dependency-name: com.android.tools.build:gradle
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: org.jetbrains.kotlin:kotlin-gradle-plugin
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      gradle-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: bundler
    directory: /example
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    groups:
      bundler-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      bundler-security:
        applies-to: security-updates
        patterns:
          - "*"
